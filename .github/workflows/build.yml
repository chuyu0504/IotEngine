name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUN_VERSION: 1.3.14
  UPX_VERSION: 5.1.1
  UPX_LINUX_SHA256: 1ff660454227861e00772f743f66b900072116b9dc24f6ee28b97cce88a7828a
  UPX_WINDOWS_SHA256: fa5380bca4c2718547aaa0134bc0d8a7fa27e102f0ac6371573d60d1c21d64de

jobs:
  vcpkg_revision:
    name: Resolve vcpkg revision
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      # Both platform builds and both packages use this one vcpkg commit.
      - name: Resolve latest vcpkg commit
        id: resolve
        run: |
          set -euo pipefail
          commit=$(git ls-remote https://github.com/microsoft/vcpkg.git HEAD | cut -f1)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  windows_client:
    name: Windows client installer
    runs-on: windows-2025
    steps:
      - name: Checkout iot-engine
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun for native HTTP/SSE integration
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Configure Windows client
        run: |
          $bun = (Get-Command bun).Source
          cmake -S clients/windows -B build/ci/windows-client -A x64 "-DIOT_EGINE_WINDOWS_BUN=$bun"

      # This target runs native CTest and packaged GUI/service self-tests before WiX.
      # Dependency preparation and checksum verification remain in CMake.
      - name: Build, test and package Windows client
        run: cmake --build build/ci/windows-client --config Release --target windows-installer --parallel 4

      - name: Verify installed service survives upgrades
        run: cmake --build build/ci/windows-client --config Release --target windows-installer-lifecycle-test

      - name: Upload installer lifecycle logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-lifecycle-${{ github.sha }}
          path: build/windows-installer-lifecycle/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: iot-engine-Windows-client-X64-${{ github.sha }}
          path: build/windows-client-downloads/*
          if-no-files-found: error
          retention-days: 30

  web_quality:
    name: Web quality and contract tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout iot-engine
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # terminal-state-test.ts runs Lua scripts against a real redis-server.
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: Frontend and contract tests
        run: |
          shopt -s nullglob
          tests=(./tests/*-test.ts ./tests/*-test.tsx)
          bun test "${tests[@]}"

  ubuntu_build:
    name: Ubuntu build
    needs: vcpkg_revision
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_COMMIT: ${{ needs.vcpkg_revision.outputs.commit }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg
    # Disposable servers for `ctest -L integration` (docs/build.md).
    services:
      postgres:
        image: timescale/timescaledb:latest-pg18
        env:
          POSTGRES_USER: iot_test
          POSTGRES_PASSWORD: iot_test
        ports:
          - 127.0.0.1:25432:5432
        options: >-
          --health-cmd "pg_isready -U iot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:latest
        ports:
          - 127.0.0.1:26379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout iot-engine
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install toolchain
        id: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build nasm curl zip unzip tar xz-utils pkg-config bison flex make redis-server
          "$CC" --version
          "$CXX" --version
          printf '#include <expected>\nint main() { std::expected<int, int> value{42}; return *value == 42 ? 0 : 1; }\n' > /tmp/iot-cxx23.cpp
          "$CXX" -std=c++23 /tmp/iot-cxx23.cpp -o /tmp/iot-cxx23
          /tmp/iot-cxx23
          echo "compiler=gcc-$("$CXX" -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Bootstrap vcpkg ${{ env.VCPKG_COMMIT }}
        run: |
          git init --quiet "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout --quiet --detach FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ steps.toolchain.outputs.compiler }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'ports/vcpkg/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ steps.toolchain.outputs.compiler }}-

      - name: Configure
        id: configure
        run: |
          # vcpkg installs during configure; restored archives skip port builds.
          before=$(find "$VCPKG_DEFAULT_BINARY_CACHE" -type f | wc -l)
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          after=$(find "$VCPKG_DEFAULT_BINARY_CACHE" -type f | wc -l)
          echo "new-binaries=$([ "$after" -gt "$before" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload configure diagnostics
        if: ${{ !cancelled() && steps.configure.conclusion == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: cmake-configure-${{ runner.os }}-${{ github.sha }}
          path: |
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/vcpkg-manifest-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save vcpkg binary cache
        if: github.ref == 'refs/heads/main' && steps.restore-vcpkg-cache.outputs.cache-hit != 'true' && steps.configure.outputs.new-binaries == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.restore-vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build/ci --config "$BUILD_TYPE" --parallel "$(nproc)"

      - name: Test
        # Hosted runners do not reliably deliver the IPv6 UDP loopback packet
        # used by gb28181-sip; keep that test available for local/targeted runs.
        run: ctest --test-dir build/ci --output-on-failure --build-config "$BUILD_TYPE" --label-exclude integration --exclude-regex '^gb28181-sip$'

      # Concurrent fixtures each run iot-engine with per-worker pools; the
      # default 100 connections are not enough. Services take no command line.
      - name: Prepare integration services
        run: |
          set -euo pipefail
          docker exec ${{ job.services.postgres.id }} psql -U iot_test -d postgres -c 'ALTER SYSTEM SET max_connections = 500'
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U iot_test; do sleep 1; done
          docker run -d --name iotci-mqtt -p 127.0.0.1:21883:1883 eclipse-mosquitto:latest mosquitto -c /mosquitto-no-auth.conf

      - name: Integration tests
        env:
          IOT_TEST_POSTGRES_URL: postgres://iot_test:iot_test@127.0.0.1:25432/postgres
          IOT_TEST_REDIS_URL: redis://127.0.0.1:26379
          IOT_TEST_MQTT_URL: mqtt://127.0.0.1:21883
        run: ctest --test-dir build/ci --output-on-failure --build-config "$BUILD_TYPE" --label-regex integration --parallel 4

      - name: Upload integration fixture logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-fixtures-${{ github.sha }}
          path: build/ci/integration/*/instance-*/engine.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Install UPX
        run: |
          set -euo pipefail
          archive="build/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          curl --fail --location --show-error --silent \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" \
            --output "$archive"
          echo "${UPX_LINUX_SHA256}  ${archive}" | sha256sum --check -
          tar -xJf "$archive" -C build
          echo "UPX_BIN=${GITHUB_WORKSPACE}/build/upx-${UPX_VERSION}-amd64_linux/upx" >> "$GITHUB_ENV"

      - name: Package artifact
        run: |
          set -euo pipefail
          cmake -E rm -rf build/artifact
          cmake -E make_directory build/artifact
          cmake -E copy build/ci/iot-engine build/artifact/iot-engine
          cmake -E copy_directory build/web build/artifact/web
          printf 'source=%s\nvcpkg=%s\n' "$GITHUB_SHA" "$VCPKG_COMMIT" > build/artifact/build-info.txt
          cmake -DDEPENDENCY_BUILD_DIR=build/ci -DDESTINATION=build/artifact \
            -P ports/cmake/stage-third-party-notices.cmake
          "$UPX_BIN" --best --lzma build/artifact/iot-engine
          "$UPX_BIN" --test build/artifact/iot-engine

      - name: Archive Linux build output
        run: tar -C build/artifact -czf build/linux-build.tar.gz .

      - name: Upload Linux build output
        uses: actions/upload-artifact@v7
        with:
          name: linux-build-${{ github.sha }}
          path: build/linux-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows_build:
    name: Windows MSVC build
    needs: vcpkg_revision
    runs-on: windows-2025
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_COMMIT: ${{ needs.vcpkg_revision.outputs.commit }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg
    steps:
      - name: Checkout iot-engine
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The Visual Studio generator uses this default toolset.
      - name: Detect MSVC toolset
        id: toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $version = (Get-Content "$installation\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected MSVC toolset version: $version" }
          "compiler=msvc-$version" >> $env:GITHUB_OUTPUT

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Bootstrap vcpkg ${{ env.VCPKG_COMMIT }}
        shell: pwsh
        run: |
          git init --quiet $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $env:VCPKG_ROOT checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg binary cache
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-${{ steps.toolchain.outputs.compiler }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'ports/vcpkg/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-${{ steps.toolchain.outputs.compiler }}-

      - name: Configure
        id: configure
        shell: pwsh
        run: |
          # vcpkg installs during configure; restored archives skip port builds.
          $before = (Get-ChildItem -Recurse -File $env:VCPKG_DEFAULT_BINARY_CACHE).Count
          cmake -S . -B build/ci `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $after = (Get-ChildItem -Recurse -File $env:VCPKG_DEFAULT_BINARY_CACHE).Count
          "new-binaries=$(($after -gt $before).ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Upload configure diagnostics
        if: ${{ !cancelled() && steps.configure.conclusion == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: cmake-configure-${{ runner.os }}-${{ github.sha }}
          path: |
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/vcpkg-manifest-install.log
            ${{ env.VCPKG_ROOT }}/buildtrees/*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save vcpkg binary cache
        if: github.ref == 'refs/heads/main' && steps.restore-vcpkg-cache.outputs.cache-hit != 'true' && steps.configure.outputs.new-binaries == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.restore-vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build/ci --config ${{ env.BUILD_TYPE }} --parallel $env:NUMBER_OF_PROCESSORS

      - name: Test
        # Hosted runners do not reliably deliver the IPv6 UDP loopback packet
        # used by gb28181-sip; keep that test available for local/targeted runs.
        # Windows runners have no PostgreSQL/TimescaleDB and Redis service
        # containers, so the `integration` tests report as skipped here and run
        # in ubuntu_build.
        run: ctest --test-dir build/ci --output-on-failure --build-config ${{ env.BUILD_TYPE }} --exclude-regex '^gb28181-sip$'

      - name: Install UPX
        shell: pwsh
        run: |
          $archive = "build/upx-$env:UPX_VERSION-win64.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/upx/upx/releases/download/v$env:UPX_VERSION/upx-$env:UPX_VERSION-win64.zip" `
            -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:UPX_WINDOWS_SHA256) {
              throw "UPX archive SHA-256 mismatch: $actualSha256"
          }
          Expand-Archive -Path $archive -DestinationPath build
          "UPX_BIN=$env:GITHUB_WORKSPACE\build\upx-$env:UPX_VERSION-win64\upx.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage artifact
        shell: pwsh
        run: |
          cmake -E rm -rf build/artifact
          cmake -E make_directory build/artifact
          cmake -E copy "build/ci/$env:BUILD_TYPE/iot-engine.exe" build/artifact/iot-engine.exe
          cmake -E copy_directory build/web build/artifact/web
          "source=$env:GITHUB_SHA`nvcpkg=$env:VCPKG_COMMIT`n" | Set-Content -NoNewline -Encoding ascii build/artifact/build-info.txt
          cmake -DDEPENDENCY_BUILD_DIR=build/ci -DDESTINATION=build/artifact `
            -P ports/cmake/stage-third-party-notices.cmake
          & $env:UPX_BIN --best --lzma build/artifact/iot-engine.exe
          if ($LASTEXITCODE -ne 0) {
              throw "UPX compression failed with exit code $LASTEXITCODE"
          }
          & $env:UPX_BIN --test build/artifact/iot-engine.exe
          if ($LASTEXITCODE -ne 0) {
              throw "UPX verification failed with exit code $LASTEXITCODE"
          }

      - name: Archive Windows build output
        run: Compress-Archive -Path build/artifact/* -DestinationPath build/windows-build.zip

      - name: Upload Windows build output
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-${{ github.sha }}
          path: build/windows-build.zip
          if-no-files-found: error
          retention-days: 1

  ubuntu_package:
    name: Linux deployment package
    needs: [vcpkg_revision, ubuntu_build, windows_build, windows_client, web_quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux build output
        uses: actions/download-artifact@v8
        with:
          name: linux-build-${{ github.sha }}
          path: build

      - name: Restore Linux build output
        run: |
          mkdir -p build/artifact
          tar -xzf build/linux-build.tar.gz -C build/artifact
          test -x build/artifact/iot-engine
          test -s build/artifact/web/index.html
          grep -qx "vcpkg=${{ needs.vcpkg_revision.outputs.commit }}" build/artifact/build-info.txt

      - name: Download Windows client for source-site distribution
        uses: actions/download-artifact@v8
        with:
          name: iot-engine-Windows-client-X64-${{ github.sha }}
          path: build/artifact/web/downloads

      - name: Include Windows client in deployment archive
        run: |
          (cd build/artifact/web/downloads && sha256sum --check iot-egine-Setup-x64.exe.sha256)
          tar -C build/artifact -czf "build/iot-engine-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: iot-engine-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: build/iot-engine-${{ runner.os }}-${{ runner.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows_package:
    name: Windows deployment package
    needs: [vcpkg_revision, ubuntu_build, windows_build, windows_client, web_quality]
    runs-on: windows-2025
    steps:
      - name: Download Windows build output
        uses: actions/download-artifact@v8
        with:
          name: windows-build-${{ github.sha }}
          path: build

      - name: Restore Windows build output
        run: |
          Expand-Archive -Path build/windows-build.zip -DestinationPath build/artifact
          if (!(Test-Path build/artifact/iot-engine.exe)) { throw 'Missing server executable' }
          if (!(Test-Path build/artifact/web/index.html)) { throw 'Missing frontend entry' }
          if (!((Get-Content build/artifact/build-info.txt) -contains 'vcpkg=${{ needs.vcpkg_revision.outputs.commit }}')) { throw 'Artifact was built from another vcpkg commit' }

      - name: Download Windows client for source-site distribution
        uses: actions/download-artifact@v8
        with:
          name: iot-engine-Windows-client-X64-${{ github.sha }}
          path: build/artifact/web/downloads

      - name: Package artifact
        shell: pwsh
        run: |
          $manifest = Get-Content build/artifact/web/downloads/windows-client.json -Raw | ConvertFrom-Json
          $actualHash = (Get-FileHash build/artifact/web/downloads/iot-egine-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $manifest.sha256) { throw 'Windows installer checksum mismatch' }
          Compress-Archive -Path build/artifact/* -DestinationPath "build/iot-engine-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: iot-engine-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: build/iot-engine-${{ runner.os }}-${{ runner.arch }}.zip
          if-no-files-found: error
          retention-days: 14
